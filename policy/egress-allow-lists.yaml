# The FQDNs an application of each isolation zone may name in its egress policy - OneK8s design
# section 16. In the design this is the zone's Azure Firewall allow-list (platform + security, high
# risk tier). Since 2026-10-15 the lab's cell is routed through labfw in the hub (network mode
# `labfw`), which enforces each zone's list from azure-landing-zone's firewall_exposures - keep the two
# in step. aks-ai-agents' traffic flow documentation reads it (design 5.2); applications name no FQDN
# in their own policies any more (design D80, the landing zone's app-egress rule), so no pull request check does.
#
# `names` are exact; `patterns` may start with a `*.` label, never one that opens a whole cloud
# service. Adding a name for a zone is a change to this file, reviewed by the platform team.
zones:
  int-fi:
    names:
      - login.microsoftonline.com
    patterns: []
  int-se:
    names:
      - login.microsoftonline.com
    patterns: []
  ext-fi:
    names:
      - login.microsoftonline.com
      - api.github.com
    patterns: []
  ext-se:
    names:
      - login.microsoftonline.com
    patterns: []
