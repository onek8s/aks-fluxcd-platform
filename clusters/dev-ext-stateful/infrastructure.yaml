# aks-dev-ext-stateful: defined, not deployed. The stateful cluster of the OneK8s design (sections 8 and
# 13) runs no Gateway API implementation and no Flux - its workloads are deployed by a pipeline and
# publish themselves with internal load balancers - so it runs none of the gateways, external-dns
# or Flux webhook of the stateless cells; only the platform's controllers and its storage. Its
# isolation zones' External Secrets Operators are still to come.
# The cluster-wide controllers, reconciled as their own Flux Kustomization rather than straight from
# this directory, so that whatever builds on them - the External Secrets stores, for one - can wait
# for them with `dependsOn: [{ name: infra-controllers }]` and is never applied before its CRDs exist.
#
# `platform` is the GitRepository the AKS Flux extension creates for the cluster's Flux
# configuration, which Terraform names `platform` and points at this directory.
#
# Each runs every 10 minutes, not only when the repository changes: cluster-settings.yaml is applied by
# `platform`, the Kustomization above these, and one of these can build a new commit before
# `platform` has applied that commit's settings - substituting a setting just added as nothing. The
# next run puts it right; at 10 minutes, soon.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/controllers
  prune: true
  wait: true
---
# The RBAC team routes need.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/configs
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# The StorageClass whose disks outlive the cluster, outside its node resource group (see
# infrastructure/storage). On its own: nothing waits for it, and it waits for nothing.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/storage
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
