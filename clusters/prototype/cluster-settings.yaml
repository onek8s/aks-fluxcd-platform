# The values that make this cluster's configuration its own, handed to the Flux Kustomizations
# through `postBuild.substituteFrom`.
#
# The `${...}` ones are filled in by the cluster's Flux configuration, which aks-terraform gives the
# facts of the Azure side as post-build variables of the `platform` Kustomization - this file is
# applied by that one. They are not to be written here by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  cluster_name: "${cluster_name}"
  azure_tenant_id: "${azure_tenant_id}"
  # The cluster's Key Vault, and for each namespace with a share of it the identity that namespace's
  # `key-vault` service account reads it as. A namespace reads the secrets named `<namespace>--...`
  # and no others.
  key_vault_url: "${key_vault_url}"
  key_vault_client_id_ingress_gateway: "${key_vault_client_id_ingress_gateway}"
  key_vault_client_id_example: "${key_vault_client_id_example}"
  # The Azure DNS zone the listener hostnames are published in, and the identity that writes it.
  dns_zone_name: "${dns_zone_name}"
  dns_zone_resource_group_name: "${dns_zone_resource_group_name}"
  dns_zone_subscription_id: "${dns_zone_subscription_id}"
  dns_identity_client_id: "${dns_identity_client_id}"
  # The Azure Private DNS zone the listener hostnames are also published in, written by the same
  # identity. Its names resolve only inside the networks it is linked to.
  internal_dns_zone_name: "${internal_dns_zone_name}"
  internal_dns_zone_resource_group_name: "${internal_dns_zone_resource_group_name}"
  internal_dns_zone_subscription_id: "${internal_dns_zone_subscription_id}"

  # Set here. The hostname the `example` team is published on, which has to be in dns_zone_name
  # (and not its apex), and the Key Vault certificate - covering it - that its listener serves. The
  # certificate is `ingress-gateway--<this name>` in the vault: ingress-gateway's share of it.
  # aks-terraform's Renew Certificate workflow issues it from Let's Encrypt and renews it there,
  # under this name for this hostname; change the two together, there and here.
  example_hostname: "hello.onek8s.lol"
  example_certificate_name: "hello-example"
  # The hostname the `example` team is published on privately, which has to be in
  # internal_dns_zone_name (and not its apex). Its listener serves the same certificate as
  # example_hostname's, which does not cover it: clients see a name mismatch there.
  example_internal_hostname: "hello.internal.onek8s.lol"

  # Set here. The hostname Traefik's dashboard is published on, in dns_zone_name, and the Key Vault
  # certificate - `ingress-gateway--<this name>`, issued and renewed by the same workflow - that its
  # listener serves. The dashboard asks for no authentication: anyone who reaches the Gateway, which
  # is only reachable from inside the network, can read it.
  traefik_hostname: "traefik.onek8s.lol"
  # The same, in internal_dns_zone_name. Served the same certificate, which does not name it.
  traefik_internal_hostname: "traefik.internal.onek8s.lol"
  traefik_certificate_name: "traefik-dashboard"
