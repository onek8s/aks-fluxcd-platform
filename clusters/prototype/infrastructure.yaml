# The cluster-wide controllers, reconciled as their own Flux Kustomization rather than straight from
# this directory, so that whatever builds on them - the External Secrets stores, for one - can wait
# for them with `dependsOn: [{ name: infra-controllers }]` and is never applied before its CRDs exist.
#
# `main` is the GitRepository the AKS Flux extension creates for the cluster's Flux configuration,
# which Terraform names `main` and points at this directory.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: main
  path: ./infrastructure/controllers
  prune: true
  wait: true
