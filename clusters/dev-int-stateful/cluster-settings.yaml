# The values that make this cluster's configuration its own, handed to the Flux Kustomizations
# through `postBuild.substituteFrom`.
#
# aks-dev-int-stateful: the OneK8s dev environment's stateful cluster, beside the stateless cells. It
# reads the environment's vaults (aks-terraform, shared/envs/dev.tfvars), so its namespaces read the
# same secrets as the same identities. Defined, not deployed for now - see infrastructure.yaml.
#
# The `${...}` ones are filled in by the cluster's Flux configuration, which aks-terraform gives the
# facts of the Azure side as post-build variables of the `platform` Kustomization - this file is
# applied by that one. They are not to be written here by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  cluster_name: "${cluster_name}"
  azure_tenant_id: "${azure_tenant_id}"
  # The cluster's Key Vault, and the identity flux-system's `key-vault` service account reads it as. A
  # namespace reads the secrets named `<namespace>--...` and no others; a tenant gets its own values
  # from its `<namespace>-access` Flux configuration (aks-terraform tenants/).
  key_vault_url: "${key_vault_url}"
  key_vault_client_id_flux_system: "${key_vault_client_id_flux_system}"
  # The one DNS zone the listener hostnames are published in (name and resource ID) and the identity
  # that writes it.
  dns_zone_name: "${dns_zone_name}"
  dns_zone_id: "${dns_zone_id}"
  dns_identity_client_id: "${dns_identity_client_id}"
  # A double quote, for the Kustomizations that substitute from this ConfigMap.
  quote: '"'
  # Where the disks of the `portable-disk` StorageClass go (infrastructure/storage): the resource
  # group of both clusters and what they share, rather than this cluster's node resource group.
  portable_disk_resource_group_name: "${portable_disk_resource_group_name}"
