# The cluster-wide parts of the platform, each its own Flux Kustomization so that whatever builds on
# another can wait for it with `dependsOn`, and nothing else is held back when one fails. The
# isolation zones are in zones.yaml.
#
# `platform` is the GitRepository the AKS Flux extension creates for the cluster's Flux
# configuration, which Terraform names `platform` and points at this directory.
#
# Each runs every 10 minutes, not only when the repository changes: cluster-settings.yaml is applied by
# `platform`, the Kustomization above these, and one of these can build a new commit before
# `platform` has applied that commit's settings - substituting a setting just added as nothing. The
# next run puts it right; at 10 minutes, soon.
#
# The platform's External Secrets Operator - its CRDs and webhook, and the controller of the
# platform's namespaces - and the Helm repositories everything else installs from.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/controllers
  prune: true
  wait: true
---
# The RBAC team routes need.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/configs
  prune: true
  wait: true
---
# external-dns, on its own: nothing waits for it, so a zone that is not set up yet - or an outage of
# Azure DNS - keeps the hostnames from being published and holds back nothing else.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/external-dns
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# external-dns for the internal zones (infrastructure/external-dns/internal): their gateways' routes
# into the private DNS zones of aks-terraform's shared/ (int-se.dev.onek8s.lol), an internal cell
# only. After `external-dns`, which creates the namespace, the Helm repository and the service account.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-internal
  namespace: flux-system
spec:
  dependsOn:
    - name: external-dns
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/external-dns/internal
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# flux-system's share of the platform vault (infrastructure/flux-system-key-vault): its SecretStore,
# which the observability chart's credentials are read through. In an external cell the flux-webhook
# Kustomization brings it; this cell has no webhook (no public entry point), no platform gateway.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system-key-vault
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/flux-system-key-vault
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# Ratify's configuration for AKS Image Integrity (infrastructure/image-verification): which
# certificate signs the platform's images, where the signatures are and as which identity Ratify reads
# them, from cluster-settings.yaml. Needs Ratify's CRDs, which AKS installs with Image Integrity
# (aks-terraform: image_integrity_enabled). Nothing waits for it: without it, unsigned and signed
# images alike are reported, and nothing is refused.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-verification
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/image-verification
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# Observability and cost (infrastructure/observability): Grafana's k8s-monitoring chart - Alloy,
# kube-state-metrics, OpenCost - sending to the environment's Grafana Cloud stack, whose endpoints and
# token come from the platform vault through flux-system's SecretStore (flux-system-key-vault).
# Nothing waits for it: without the stack's secret, it waits and holds nothing back.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
    - name: flux-system-key-vault
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/observability
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
# No platform gateway and no Flux webhook: behind the hub's labfw a public load balancer cannot answer
# (its replies would leave by the default route), and an internal cell has no public entry point.
# No `storage` Kustomization: the cell is stateless.
---
# AKS's ip-masq-agent translates nothing, so every pod's flow reaches labfw with the pod's
# own address (infrastructure/pod-addresses-to-firewall); labfw translates what leaves the landing zone.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pod-addresses-to-firewall
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/pod-addresses-to-firewall
  prune: true
  wait: true
---
# The zones' classic node pools (aks-terraform zone_node_pools): the cluster autoscaler's priority expander takes the spot pools first
# (infrastructure/autoscaler-priority).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: autoscaler-priority
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/autoscaler-priority
  prune: true
  wait: true
