# The cell's isolation zones (design, "Isolation zone"): per enabled country one Flux Kustomization over
# infrastructure/zones -
# the zone's gateway, External Secrets Operator and Cilium policies - with the zone's values. The
# client IDs of the zones' gateways and their GatewayClasses (Traefik or App Routing, aks-terraform's
# gateway_implementation) are aks-terraform's, filled in by the `platform` Kustomization that applies
# this file. Each zone waits for the controllers (the External Secrets CRDs); nothing waits for a zone,
# so one that does not come up holds back no other. No NodePools: a pod-subnet cell (design D74) has no
# node auto provisioning, its zones' nodes are classic node pools of aks-terraform (zone_node_pools).
#
# The cell is internal (OneK8s design decision D52) and runs Sweden's int-se only (Finland's int-fi runs in
# az2). It has no overlay (design D59, D74), so each zone also gets `firewall-egress-<zone>`: its applications'
# egress outside the cluster is left to the hub's firewall (infrastructure/zones/firewall-egress).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zone-int-se
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  retryInterval: 1m
  # A zone's first node takes a few minutes to be provisioned.
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/zones
  # What only the cell's Gateway API implementation takes (aks-terraform's gateway_implementation).
  components:
    - ./gateway-implementations/${gateway_implementation}
  prune: true
  wait: true
  postBuild:
    substitute:
      zone: int-se
      zone_exposure: int
      zone_internal: "true"
      zone_domain: int-se.dev.onek8s.lol
      gateway_client_id: "${key_vault_client_id_int_se_gateway}"
      gateway_class_name: "${gateway_class_name_int_se}"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firewall-egress-int-se
  namespace: flux-system
spec:
  dependsOn:
    - name: zone-int-se
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/zones/firewall-egress
  prune: true
  wait: true
  postBuild:
    substitute:
      zone: int-se
