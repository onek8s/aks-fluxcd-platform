# The values that make this cluster's configuration its own, handed to the Flux Kustomizations
# through `postBuild.substituteFrom`.
#
# aks-dev-stateless-az1: one of the OneK8s dev environment's stateless cells (design section 8), with its own
# network, isolation zones and gateways. Every cell runs every external application; Azure Traffic
# Manager hands out one cell or another (aks-terraform, shared/: global_hostnames).
#
# The `${...}` ones are filled in by the cluster's Flux configuration, which aks-terraform gives the
# facts of the Azure side as post-build variables of the `platform` Kustomization - this file is
# applied by that one. They are not to be written here by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  cluster_name: "${cluster_name}"
  azure_tenant_id: "${azure_tenant_id}"
  # The environment's platform Key Vault - the gateways' certificates, the Flux webhook token - and,
  # for each namespace with a share of a vault, the vault and the identity that namespace's
  # `key-vault` service account reads it as. A namespace reads the secrets named `<namespace>--...`
  # and no others. The zones' gateways get theirs in zones.yaml.
  key_vault_url: "${key_vault_url}"
  key_vault_client_id_flux_system: "${key_vault_client_id_flux_system}"
  key_vault_client_id_platform_gateway: "${key_vault_client_id_platform_gateway}"
  key_vault_client_id_ext_fi_example: "${key_vault_client_id_ext_fi_example}"
  key_vault_url_ext_fi_example: "${key_vault_url_ext_fi_example}"
  # The public zone the external gateways' hostnames are published in, the internal zones' resource
  # group, and the identity external-dns writes them as.
  dns_zone_name: "${dns_zone_name}"
  dns_zone_resource_group_name: "${dns_zone_resource_group_name}"
  dns_zone_subscription_id: "${dns_zone_subscription_id}"
  dns_identity_client_id: "${dns_identity_client_id}"
  internal_dns_resource_group_name: "${internal_dns_resource_group_name}"
  # Where node auto provisioning puts each zone's nodes (infrastructure/node-pools): the zone's own
  # node subnet, and the cell's availability zone (`swedencentral-1`) every zone NodePool requires.
  nap_subnet_id_int_fi: "${nap_subnet_id_int_fi}"
  nap_subnet_id_int_se: "${nap_subnet_id_int_se}"
  nap_subnet_id_ext_fi: "${nap_subnet_id_ext_fi}"
  nap_subnet_id_ext_se: "${nap_subnet_id_ext_se}"
  nap_availability_zone: "${nap_availability_zone}"
  # A double quote, for the Kustomizations that substitute from this ConfigMap: kustomize drops the
  # quotes around "${...}", so a value that must stay a string is written ${quote}...${quote}.
  quote: '"'

  # Set here: the platform gateway's hostnames (infrastructure/platform-gateway), this cluster's own,
  # one level below dns_zone_name for the platform's wildcard certificate (*.onek8s.lol).
  # GitHub's webhooks point at the first (aks-terraform, Flux webhooks workflow); the second is
  # Traefik's dashboard, with no authentication - a prototype's choice.
  flux_webhook_hostname: "flux-webhook-dev-stateless-az1.onek8s.lol"
  traefik_hostname: "traefik-dev-stateless-az1.onek8s.lol"
