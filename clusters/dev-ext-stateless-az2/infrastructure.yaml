# The cluster-wide parts of the platform, each its own Flux Kustomization so that whatever builds on
# another can wait for it with `dependsOn`, and nothing else is held back when one fails. The
# isolation zones are in zones.yaml.
#
# `platform` is the GitRepository the AKS Flux extension creates for the cluster's Flux
# configuration, which Terraform names `platform` and points at this directory.
#
# Each runs every 10 minutes, not only when the repository changes: cluster-settings.yaml is applied by
# `platform`, the Kustomization above these, and one of these can build a new commit before
# `platform` has applied that commit's settings - substituting a setting just added as nothing. The
# next run puts it right; at 10 minutes, soon.
#
# The platform's External Secrets Operator - its CRDs and webhook, and the controller of the
# platform's namespaces - and the Helm repositories everything else installs from.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/controllers
  prune: true
  wait: true
---
# The RBAC team routes need.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/configs
  prune: true
  wait: true
---
# The platform's own gateway, on the system pool: Flux's webhook receivers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-gateway
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/platform-gateway
  # What only the cell's Gateway API implementation takes (aks-terraform's gateway_implementation).
  components:
    - ./gateway-implementations/${gateway_implementation}
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# external-dns, on its own: nothing waits for it, so a zone that is not set up yet - or an outage of
# Azure DNS - keeps the hostnames from being published and holds back nothing else.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/external-dns
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# Flux's webhook receiver, published on the platform gateway so a GitHub push reconciles the
# platform at once (see infrastructure/flux-webhook). Nothing waits for it: without it, Flux still
# polls.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
    - name: platform-gateway
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/flux-webhook
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# The nodes of the external isolation zones - ext-fi, ext-se (OneK8s design decision D52: an external
# cell runs no internal zone) - as node auto provisioning
# NodePools, on-demand and spot, amd64 and arm64 (infrastructure/node-pools), each in its zone's
# subnet and this cell's availability zone from cluster-settings.yaml. Needs NAP's CRDs, which AKS
# installs with node auto provisioning (aks-terraform: node_auto_provisioning_enabled).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-pools
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/node-pools/external
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# Ratify's configuration for AKS Image Integrity (infrastructure/image-verification): which
# certificate signs the platform's images, where the signatures are and as which identity Ratify reads
# them, from cluster-settings.yaml. Needs Ratify's CRDs, which AKS installs with Image Integrity
# (aks-terraform: image_integrity_enabled). Nothing waits for it: without it, unsigned and signed
# images alike are reported, and nothing is refused.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-verification
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/image-verification
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# Observability and cost (infrastructure/observability): Grafana's k8s-monitoring chart - Alloy,
# kube-state-metrics, OpenCost - sending to the environment's Grafana Cloud stack, whose endpoints and
# token come from the platform vault through flux-system's SecretStore (the flux-webhook
# Kustomization). Nothing waits for it: without the stack's secret, it waits and holds nothing back.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
    - name: flux-webhook
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/observability
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
# No `storage` Kustomization: the cell is stateless. AKS runs none of its CSI drivers here
# (aks-terraform: persistent_storage_enabled = false), and Azure Policy keeps it that way
# (azure-landing-zone stacks/aks-policy, `no-persistent-storage`, effect Deny): no StorageClass,
# PersistentVolume or claim, no csi or ephemeral volume.
