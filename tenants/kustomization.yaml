# Team namespaces whose own repositories Flux deploys. Each cluster pulls this directory in through
# its `tenants` Flux Kustomization - see clusters/<cluster>/tenants.yaml.
#
# The namespaces themselves are AKS managed namespaces created by aks-terraform (managed_namespaces),
# with their quota, default network policy and Pod Security Standard. Nothing here creates them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - example
