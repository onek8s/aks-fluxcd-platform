# What team namespaces need inside the cluster to deploy from their own repositories. Each cluster
# pulls this directory in through its `tenants` Flux Kustomization - see
# clusters/<cluster>/tenants.yaml - the external cells; an internal cell names its own tenants
# directly (clusters/dev-int-stateless-az1/tenants.yaml: tenants/int-fi-example).
#
# The namespaces themselves are AKS managed namespaces created by aks-terraform (managed_namespaces),
# with their quota, default network policy and Pod Security Standard, and so is the Flux
# configuration that syncs each team's repository (managed_namespaces.<team>.flux). Nothing here
# creates them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ext-fi-example
