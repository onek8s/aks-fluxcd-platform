# The `example` team's application in the ext-fi zone: onek8s/aks-fluxcd-example, applied into the
# `ext-fi-example` namespace and nowhere else. The namespace, its default policies and its Flux
# configuration are aks-terraform's (managed_namespaces); the zone's Cilium baseline lets the ext-fi
# gateway in and nothing out but cluster DNS (infrastructure/zones/cilium.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - key-vault.yaml
  - webhook.yaml
