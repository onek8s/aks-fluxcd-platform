# RETIRED with sync.yaml, which is the only thing still naming it: the namespace's own Flux
# configuration applies the team's repository as the extension's `flux-applier` instead. Delete
# this file together with sync.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-reconciler
  namespace: example
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-reconciler
  namespace: example
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: flux-reconciler
    namespace: example
