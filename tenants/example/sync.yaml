# The team's repository, synced into its own namespace. The AKS Flux extension refuses references
# across namespaces, so the source sits next to the Kustomization that reads it.
#
# The repository is private. `aks-fluxcd-example-git` holds a read-only token for it, synced from Key
# Vault by key-vault.yaml - see the README; Git is no place for it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: aks-fluxcd-example
  namespace: example
spec:
  interval: 5m
  url: https://github.com/olljanat-ai/aks-fluxcd-example
  ref:
    branch: main
  secretRef:
    name: aks-fluxcd-example-git
  # Only the manifests are of any interest to the cluster.
  ignore: |
    /*
    !/apps/
---
# `targetNamespace` puts everything in `example` whatever the manifests say, and the service account
# keeps it there even if they try otherwise. `wait` holds the Kustomization not-ready until the apps
# have rolled out.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: example
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: aks-fluxcd-example
  path: ./apps
  targetNamespace: example
  serviceAccountName: flux-reconciler
  prune: true
  wait: true
