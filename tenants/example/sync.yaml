# RETIRED. The team's repository is now synced by a Flux configuration of its own that aks-terraform
# creates in this namespace (managed_namespaces.example.flux), which shows its status in the
# portal's GitOps view. These two objects are kept, suspended, for one release only:
#
# - `suspend` stops them, so they no longer apply the repository alongside the new configuration.
# - `prune: false` makes deleting the Kustomization later a no-op for what it applied. Deleted while
#   still pruning, it would garbage-collect every object it last applied - the team's running
#   Deployment included - whenever it had applied them after the new configuration.
#
# Delete this file, and flux-reconciler in rbac.yaml, once the new configuration is Ready.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: aks-fluxcd-example
  namespace: example
spec:
  suspend: true
  interval: 5m
  url: https://github.com/olljanat-ai/aks-fluxcd-example
  ref:
    branch: main
  secretRef:
    name: aks-fluxcd-example-git
  ignore: |
    /*
    !/apps/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: example
spec:
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: aks-fluxcd-example
  path: ./apps
  targetNamespace: example
  serviceAccountName: flux-reconciler
  prune: false
  wait: true
