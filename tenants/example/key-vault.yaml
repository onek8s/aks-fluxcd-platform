# Key Vault, read as the `example` namespace's share of it: the secrets named `example--...`, and no
# others - see infrastructure/certificates/secret-store.yaml for how. The service account's name is
# part of the federation aks-terraform makes, so it cannot change.
#
# The platform syncs nothing for the team from here: its manifests and images come from the
# environment's container registry, read without a secret. The team holds `admin` in the namespace,
# so it can add ExternalSecrets of its own against this store - or SecretStores of its own naming
# this service account - and read its own secrets with them. The team's writers can put secrets
# under the prefix in the vault themselves.
#
# The `${...}` values come from aks-terraform, through cluster-settings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: key-vault
  namespace: example
  annotations:
    azure.workload.identity/client-id: ${key_vault_client_id_example}
    azure.workload.identity/tenant-id: ${azure_tenant_id}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: key-vault
  namespace: example
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${key_vault_url}
      serviceAccountRef:
        name: key-vault
