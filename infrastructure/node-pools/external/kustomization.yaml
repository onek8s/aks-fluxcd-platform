# The external isolation zones' NodePools, for a cluster of the external exposure (OneK8s design
# decision D52): one directory per country's zone - all of them; a cluster that runs only some countries
# pulls in their directories instead (clusters/<cluster>/zones.yaml). What each holds is described in
# ../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ext-fi
  - ext-se
