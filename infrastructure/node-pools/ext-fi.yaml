# The ext-fi isolation zone's nodes (external workloads of Finland), provisioned by node auto
# provisioning (Karpenter): the zone's AKSNodeClass and its two NodePools, `extfi` on on-demand VMs
# and `extfispot` on Spot VMs, and its GPU AKSNodeClass and NodePool `extfigpu`. See kustomization.yaml
# for what every zone shares.
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: extfi
  annotations:
    kubernetes.io/description: "Nodes of the ext-fi zone"
spec:
  imageFamily: AzureLinux
  # The zone's own node subnet in the cell, snet-ext-fi-nodes, behind the zone's NSG (aks-terraform:
  # isolation_zones).
  vnetSubnetID: "${nap_subnet_id_ext_fi}"
  security:
    encryptionAtHost: true
  tags:
    platform-zone: ext-fi
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: extfi
  annotations:
    kubernetes.io/description: "ext-fi zone, on-demand, amd64 and arm64"
spec:
  # Tried after extfispot for a pod that tolerates spot; the only NodePool of the zone for one that
  # does not.
  weight: 10
  # Sized for N+1 - this cell carrying the whole environment alone - and small in the lab.
  limits:
    cpu: "16"
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "10%"
  template:
    metadata:
      labels:
        platform/zone: ext-fi
        # Lets Karpenter count the Cilium agent in the node's overhead.
        kubernetes.azure.com/ebpf-dataplane: cilium
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: extfi
      expireAfter: 720h
      taints:
        - key: platform/zone
          value: ext-fi
          effect: NoSchedule
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["${nap_availability_zone}"]
        - key: karpenter.azure.com/sku-series
          operator: In
          values: ["Ds_v5", "Ds_v6", "Es_v5", "Es_v6", "Dps_v6", "Eps_v6"]
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: extfispot
  annotations:
    kubernetes.io/description: "ext-fi zone, spot, amd64 and arm64"
spec:
  # Tried first for a pod that tolerates spot; extfi takes it when Azure has no spot capacity.
  weight: 50
  # How much of the zone may run on spot. Not part of the N+1 sizing: spot can disappear exactly
  # when the cell is pre-scaled.
  limits:
    cpu: "8"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "10%"
  template:
    metadata:
      labels:
        platform/zone: ext-fi
        kubernetes.azure.com/ebpf-dataplane: cilium
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: extfi
      expireAfter: 720h
      # The spot taint keeps every pod that did not choose spot (platform/capacity: spot) off
      # these nodes - also off spot nodes that already exist and have room.
      taints:
        - key: platform/zone
          value: ext-fi
          effect: NoSchedule
        - key: platform/capacity
          value: spot
          effect: NoSchedule
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["${nap_availability_zone}"]
        - key: karpenter.azure.com/sku-series
          operator: In
          values: ["Ds_v5", "Ds_v6", "Es_v5", "Es_v6", "Dps_v6", "Eps_v6"]
---
# The zone's GPU nodes (design decision D42): NVIDIA H100, on-demand, created only for a pod that asks
# for nvidia.com/gpu and is labelled platform/accelerator: nvidia-gpu (Azure Policy adds the
# toleration), removed a minute after the last such pod is gone. AKS installs and runs the NVIDIA
# driver, device plugin and DCGM metrics exporter on them (managed GPU, preview - the tag below;
# aks-terraform registers ManagedGPUExperiencePreview).
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: extfigpu
  annotations:
    kubernetes.io/description: "GPU nodes of the ext-fi zone"
spec:
  imageFamily: AzureLinux
  vnetSubnetID: "${nap_subnet_id_ext_fi}"
  security:
    encryptionAtHost: true
  tags:
    platform-zone: ext-fi
    platform-accelerator: nvidia-gpu
    EnableManagedGPUExperience: "true"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: extfigpu
  annotations:
    kubernetes.io/description: "ext-fi zone, NVIDIA GPU, on-demand, amd64"
spec:
  # Only GPU pods tolerate its taint, and only this NodePool offers GPUs: the weight orders nothing.
  weight: 5
  # How many GPU vCPUs the zone may run, per cluster (cluster-settings.yaml gpu_cpu_limit): 40 is one
  # Standard_NC40ads_H100_v5 (40 vCPU, 320 GiB, one H100). 0 - the dev lab's - means NAP never creates a
  # GPU node, and a GPU pod stays Pending; so does an unset setting (the default), never unlimited. The GPU VM family also has its own vCPU quota in the
  # subscription (StandardNCadsH100v5Family), which Azure starts at 0.
  limits:
    cpu: ${gpu_cpu_limit:=0}
    memory: 330Gi
  # A GPU node is the most expensive thing in the cell: gone a minute after it is empty.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"
  template:
    metadata:
      labels:
        platform/zone: ext-fi
        platform/accelerator: nvidia-gpu
        kubernetes.azure.com/ebpf-dataplane: cilium
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: extfigpu
      expireAfter: 720h
      taints:
        - key: platform/zone
          value: ext-fi
          effect: NoSchedule
        - key: platform/accelerator
          value: nvidia-gpu
          effect: NoSchedule
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["${nap_availability_zone}"]
        # The only GPU VMs with VNet encryption (and encryption at host): NC H100 v5. The series name
        # alone does not fix the GPU, so the GPU is required too.
        - key: karpenter.azure.com/sku-series
          operator: In
          values: ["NCads_v5"]
        - key: karpenter.azure.com/sku-gpu-manufacturer
          operator: In
          values: ["nvidia"]
        - key: karpenter.azure.com/sku-gpu-name
          operator: In
          values: ["H100"]
