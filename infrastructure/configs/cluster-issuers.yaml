# Let's Encrypt, answering the HTTP-01 challenge through the `http` listener of the public Gateway:
# cert-manager attaches a short-lived HTTPRoute for the challenge path to it, in the Gateway's
# namespace, and removes it once the certificate is issued.
#
# `letsencrypt` is what the Gateway uses. `letsencrypt-staging` issues untrusted certificates under
# far looser rate limits - point the Gateway's annotation at it while trying out a new hostname.
#
# No contact address: Let's Encrypt no longer sends expiry mail, and cert-manager renews 30 days
# before expiry on its own.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                namespace: ingress-gateway
                name: public
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                namespace: ingress-gateway
                name: public
                sectionName: http
