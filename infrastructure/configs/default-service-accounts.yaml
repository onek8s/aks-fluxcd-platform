# Kubernetes' own namespaces that run no pods: their default service accounts hand no token to a pod
# that names none (CIS AKS Benchmark 4.1.5). kube-system and the namespaces of AKS add-ons are AKS's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: default
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: kube-public
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: kube-node-lease
automountServiceAccountToken: false
