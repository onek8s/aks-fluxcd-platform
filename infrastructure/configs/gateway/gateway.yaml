# The cluster's entry point: a Gateway of Traefik Proxy (`traefik` - see
# infrastructure/traefik), reached through an Azure internal load balancer. Its address is the private
# IP AKS gives the load balancer in the cluster's network, which Traefik copies into the Gateway's
# status; external-dns publishes each hostname below as an A record to it - in the public zone or the
# private one, whichever the hostname is in - and every listener serves one wildcard certificate for
# both zones, synced from Key Vault (infrastructure/certificates). Nothing outside the network can
# reach it.
#
# The platform owns everything here: which hostnames the cluster answers to, which team may attach
# routes to each one, and the TLS certificate they serve. A team publishes an app by attaching an
# HTTPRoute to the listener it is given, naming neither hostname nor certificate.
#
# The listener ports are Traefik's entry points inside the pod - 8000 for `web`, 8443 for
# `websecure` - which Traefik requires a listener to name; the load balancer serves them on 80 and
# 443.
#
#   ${example_hostname}            The hostname the `example` team is published on.
#   ${example_internal_hostname}   The same, in the private zone.
#   ${traefik_hostname}            Traefik's own dashboard (dashboard.yaml).
#   ${traefik_internal_hostname}   The same, in the private zone.
#
# Set per cluster in clusters/<cluster>/cluster-settings.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: ingress-gateway
spec:
  gatewayClassName: traefik
  listeners:
    # Plain HTTP only redirects to HTTPS (https-redirect.yaml). Nothing outside this namespace
    # attaches.
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
    # One HTTPS listener per published hostname, each open to the routes of one team namespace.
    - name: https-example
      protocol: HTTPS
      port: 8443
      hostname: ${example_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: example
    # The same team, on its hostname in the private zone.
    - name: https-example-internal
      protocol: HTTPS
      port: 8443
      hostname: ${example_internal_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: example
    # Traefik's dashboard, routed by dashboard.yaml. Only routes of this namespace attach.
    - name: https-traefik
      protocol: HTTPS
      port: 8443
      hostname: ${traefik_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Same
    # The dashboard on its hostname in the private zone.
    - name: https-traefik-internal
      protocol: HTTPS
      port: 8443
      hostname: ${traefik_internal_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Same
