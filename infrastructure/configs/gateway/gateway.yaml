# The cluster's entry point: one Gateway of Traefik Proxy (`traefik` - see infrastructure/traefik),
# `public`, behind Traefik's one load balancer, on the `web-pub` and `websecure-pub` entry points
# (9000, 9443). The load balancer is on the internet when the zone is public, and an Azure internal
# load balancer, reachable from inside the network only, when it is private (dns_zone_private,
# aks-terraform). external-dns publishes every listener hostname in the one zone as a CNAME to
# ${public_hostname} - the Gateway's target annotation - which external-dns-public keeps as an A
# record to the load balancer's address. Every HTTPS listener serves the one wildcard certificate of
# the zone, synced from Key Vault (infrastructure/certificates).
#
# The platform owns everything here: which hostnames the cluster answers to, which team may attach
# routes to each one, and the TLS certificate they serve. A team publishes an app by attaching an
# HTTPRoute to the listeners it is given, naming neither hostname nor certificate.
#
# Traefik requires a listener's port to be one of its entry points inside the pod; the load
# balancer serves them on 80 and 443.
#
#   ${example_hostname}            The `example` team, this cluster's own name.
#   ${example_global_hostname}     The `example` team, the name every stateless cluster serves.
#   ${traefik_hostname}            Traefik's own dashboard (dashboard.yaml).
#   ${flux_webhook_hostname}       Flux's GitHub webhook receiver (infrastructure/flux-webhook).
#
# Set per cluster in clusters/<cluster>/cluster-settings.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: ingress-gateway
  annotations:
    external-dns.kubernetes.io/target: ${public_hostname}
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 9000
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-example
      protocol: HTTPS
      port: 9443
      hostname: ${example_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: example
    # The hostname every stateless cluster serves the team on at once (hello.onek8s.lol): the same
    # routes as https-example, under a name whose DNS record is aks-terraform's Traffic Manager, not
    # this cluster's - external-dns leaves it alone (infrastructure/external-dns).
    - name: https-example-global
      protocol: HTTPS
      port: 9443
      hostname: ${example_global_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: example
    - name: https-traefik
      protocol: HTTPS
      port: 9443
      hostname: ${traefik_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Same
    # Flux's webhook receiver; its route lives in flux-system, next to the receiver.
    - name: https-flux-webhook
      protocol: HTTPS
      port: 9443
      hostname: ${flux_webhook_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
