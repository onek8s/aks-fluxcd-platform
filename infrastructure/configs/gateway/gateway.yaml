# The cluster's public entry point: a frontend of the Application Gateway for Containers load balancer
# in application-load-balancer.yaml, programmed by the ALB Controller add-on (`azure-alb-external` -
# see aks-terraform). Its address is an Azure-generated FQDN, `<random>.fzNN.alb.azure.com`, in the
# Gateway's status; the hostnames below are CNAMEs to it.
#
# The platform owns everything here: which hostnames the cluster answers to, which team may attach
# routes to each one, and the TLS certificate of each. A team publishes an app by attaching an
# HTTPRoute to the listener it is given, naming neither hostname nor certificate.
#
#   ${example_hostname}   The hostname the `example` team is published on.
#
# Set per cluster in clusters/<cluster>/cluster-settings.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: ingress-gateway
  annotations:
    alb.networking.azure.io/alb-namespace: ingress-gateway
    alb.networking.azure.io/alb-name: public
    # cert-manager keeps a certificate for every HTTPS listener below that names a hostname, in the
    # Secret its certificateRefs names.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: azure-alb-external
  listeners:
    # Plain HTTP serves two things only: the ACME HTTP-01 challenges of cert-manager, and a redirect
    # to HTTPS for everything else (https-redirect.yaml). Nothing outside this namespace attaches.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    # One HTTPS listener per published hostname, each open to the routes of one team namespace.
    - name: https-example
      protocol: HTTPS
      port: 443
      hostname: ${example_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: https-example-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: example
