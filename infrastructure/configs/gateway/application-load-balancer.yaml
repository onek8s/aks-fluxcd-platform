# The Application Gateway for Containers resource itself. The ALB Controller add-on creates it in the
# cluster's node resource group, associated with the subnet named here, and deletes it again with
# this object. It takes five minutes or so to provision.
#
# `${agc_subnet_id}` comes from aks-terraform, through cluster-settings.
apiVersion: alb.networking.azure.io/v1
kind: ApplicationLoadBalancer
metadata:
  name: public
  namespace: ingress-gateway
spec:
  associations:
    - ${agc_subnet_id}
