# Where the public Gateway and the Application Gateway for Containers load balancer behind it are
# defined. The proxies themselves are an Azure resource, not pods; what does run here are the HTTP-01
# solver pods cert-manager starts for the Gateway's certificates.
#
# Held to the restricted Pod Security Standard, like every namespace the cluster manages itself. The
# solver pods run non-root, with no privilege escalation, every capability dropped and the
# RuntimeDefault seccomp profile, so they meet it as they are.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
