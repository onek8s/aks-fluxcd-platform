# Where the public Gateway, the Application Gateway for Containers load balancer behind it and the
# Secrets holding its listener certificates live. The proxies are an Azure resource, not pods, so
# nothing runs here.
#
# Held to the restricted Pod Security Standard, like every namespace the cluster manages itself.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
