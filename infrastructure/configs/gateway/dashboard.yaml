# Traefik's dashboard, on the `https-traefik` listener, with no authentication: anyone who can reach
# the Gateway - from inside the network only - can read it. It is read-only; the dashboard changes
# nothing in Traefik.
#
# The dashboard and the API it reads are Traefik's internal service `api@internal` (the chart's
# `api.dashboard`, on by default), which the Gateway API provider lets a route name as a
# TraefikService. Nothing of that kind exists in the cluster - the CRD is not even installed - and
# Traefik resolves the name itself. The bare hostname is sent on to the dashboard's own path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashboard
  namespace: ingress-gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      sectionName: https-traefik
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /dashboard/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /dashboard
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: api@internal
