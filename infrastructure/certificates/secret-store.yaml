# Key Vault, read as ingress-gateway's share of it: the secrets named `ingress-gateway--...`, and no
# others. ingress-gateway reads it as an identity aks-terraform creates - the environment's shared
# `id-<region>-<environment>-shared-kv-ingress-gateway` on a shared vault, the cluster's own
# otherwise - granted Key Vault Secrets User on the vault with a condition that holds it to that
# prefix, and federated with this service account: `key-vault` in `ingress-gateway`. The name is part
# of the federation, so it cannot change.
#
# External Secrets Operator itself runs with no Azure identity at all. It requests a token for this
# service account each time it reads the vault, so only this store, in this namespace, can.
#
# The `${...}` values come from aks-terraform, through cluster-settings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: key-vault
  namespace: ingress-gateway
  annotations:
    azure.workload.identity/client-id: ${key_vault_client_id_ingress_gateway}
    azure.workload.identity/tenant-id: ${azure_tenant_id}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: key-vault
  namespace: ingress-gateway
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${key_vault_url}
      serviceAccountRef:
        name: key-vault
