# Key Vault, read as the `<cluster identity>-tls` identity aks-terraform creates. That identity is
# federated with this service account - `keyvault-certificates` in `ingress-gateway`; the name is
# part of the federation, so it cannot change - and holds Key Vault Secrets User on the vault.
#
# External Secrets Operator itself runs with no Azure identity at all. It requests a token for this
# service account each time it reads the vault, so only this store, in this namespace, can.
#
# The `${...}` values come from aks-terraform, through cluster-settings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keyvault-certificates
  namespace: ingress-gateway
  annotations:
    azure.workload.identity/client-id: ${tls_identity_client_id}
    azure.workload.identity/tenant-id: ${azure_tenant_id}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: key-vault
  namespace: ingress-gateway
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${tls_key_vault_url}
      serviceAccountRef:
        name: keyvault-certificates
