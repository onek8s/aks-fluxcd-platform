# The certificate every listener of the Gateway serves: Key Vault certificate
# `ingress-gateway--${gateway_certificate_name}` (cluster-settings) - a wildcard for the zone,
# `*.<dns_zone_name>` - as the
# `kubernetes.io/tls` Secret the listeners name. A certificate's private key is only readable as the
# secret behind it, which Key Vault holds as a PKCS#12 (PFX) bundle - the default when a certificate
# is imported or issued - and that is unpacked into PEM here.
#
# A new version in the vault - a renewal - reaches the Secret within the hour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-tls
  namespace: ingress-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: key-vault
  target:
    name: gateway-tls
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ .pfx | b64dec | pkcs12cert }}'
        tls.key: '{{ .pfx | b64dec | pkcs12key }}'
  data:
    - secretKey: pfx
      remoteRef:
        key: secret/ingress-gateway--${gateway_certificate_name}
