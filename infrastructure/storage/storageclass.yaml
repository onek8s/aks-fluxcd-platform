# Azure Disks that outlive the cluster, for a workload that is to be moved to another one.
#
# AKS's own StorageClasses (`default`, `managed-csi`, ...) put a volume's disk in the node resource
# group, which AKS deletes together with the cluster - the data with it. This one puts it in
# ${portable_disk_resource_group_name}, the resource group the environment's clusters and their shared
# resources are in (aks-terraform, portable_disks_enabled). aks-terraform grants each cluster's
# identity a role of its own there for disks and snapshots, which the Azure Disk CSI driver needs to
# create a disk outside the node resource group.
#
#   - StandardSSD_ZRS: a zone-redundant disk attaches to a node in any zone of the region, so the
#     cluster it moves to need not have its nodes where the first one had them.
#   - Retain: deleting the PVC - or the whole cluster - leaves the disk where it is. The cluster that
#     takes the workload over binds it again with a PersistentVolume naming the disk's resource ID;
#     see the README, "Persistent volumes". A disk no longer wanted is deleted in Azure by hand.
#   - WaitForFirstConsumer: the disk is created once a pod is scheduled, in a zone that pod can use.
#
# It is not the default class - AKS keeps `default` as that and puts it back if changed - so a PVC
# names `storageClassName: portable-disk`. In the users' namespaces it is the only class there is:
# Azure Policy (azure-landing-zone stacks/aks-policy, `portable-storage-only`) refuses a claim on
# any other, or on none.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: portable-disk
provisioner: disk.csi.azure.com
parameters:
  skuName: StandardSSD_ZRS
  resourceGroup: ${portable_disk_resource_group_name}
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
