# Key Vault, read as traefik's share of it: the secrets named `traefik--...`, and no others - see
# infrastructure/certificates/secret-store.yaml for how. The service account's name is part of the
# federation aks-terraform makes, so it cannot change.
#
# The `${...}` values come from aks-terraform, through cluster-settings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: key-vault
  namespace: traefik
  annotations:
    azure.workload.identity/client-id: ${key_vault_client_id_traefik}
    azure.workload.identity/tenant-id: ${azure_tenant_id}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: key-vault
  namespace: traefik
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${key_vault_url}
      serviceAccountRef:
        name: key-vault
