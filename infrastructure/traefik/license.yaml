# The Traefik Hub license token, Key Vault secret `traefik--hub-license`, as the `token` key of the
# `traefik-hub-license` Secret the chart reads. It is put in the vault by hand - see the README; Git is
# no place for it. Until it is there the Secret is not created and the Traefik pods do not start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-hub-license
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: key-vault
  target:
    name: traefik-hub-license
  data:
    - secretKey: token
      remoteRef:
        key: secret/traefik--hub-license
