# Where Traefik Proxy runs. Held to the restricted Pod Security Standard, like every
# namespace the cluster manages itself: the chart runs Traefik non-root, with no privilege
# escalation, every capability dropped, a read-only root file system and the RuntimeDefault seccomp
# profile, so it meets it as it is.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
