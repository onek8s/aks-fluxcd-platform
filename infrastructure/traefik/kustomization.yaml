# Traefik Proxy, the controller behind the `traefik` GatewayClass that the `public`
# Gateway in ingress-gateway (infrastructure/configs/gateway) is served by. Reconciled as its own
# Flux Kustomization - see clusters/<cluster>/infrastructure.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
