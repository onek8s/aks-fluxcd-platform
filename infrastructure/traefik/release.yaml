# Traefik Hub API Gateway: Traefik Proxy with the API Gateway features of Traefik Hub turned on by a
# license. It serves the Kubernetes Gateway API - the `traefik` GatewayClass, created by the chart -
# and nothing else: no IngressClass, no Ingress provider, no Gateway of the chart's own. The Gateway
# and its listeners are the platform's, in infrastructure/configs/gateway.
#
# It is reached through an Azure internal load balancer: the Service is of type LoadBalancer with the
# `azure-load-balancer-internal` annotation, so AKS gives it a private address in the cluster's
# network rather than a public one. Traefik copies that address into the status of the Gateways it
# serves, and external-dns publishes the listener hostnames as A records to it.
#
# The license is the `token` key of the `traefik-hub-license` Secret in this namespace. It is created
# by hand - see the README; Git is no place for it. Without it the pods do not start, which is why
# this is a Flux Kustomization of its own that nothing waits for.
#
# The chart installs the Traefik and Traefik Hub CRDs from its crds/ directory. The Gateway API CRDs
# are not among them: AKS manages those (aks-terraform), and nothing else may bring its own.
#
# The version follows patch releases on its own; a new minor version is a change to this file. The
# chart picks the Traefik Hub image version it was released with.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  # The release lives in flux-system, where the AKS Flux extension's `flux-applier` service account
  # holds the rights to install it, and is installed into `traefik` - see the README.
  releaseName: traefik
  targetNamespace: traefik
  storageNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: "41.6.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    hub:
      token: traefik-hub-license
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    gateway:
      enabled: false
    ingressClass:
      enabled: false
    # Listeners of the Gateway name these ports - 8000 and 8443, the entry points inside the pod - and
    # the load balancer takes the usual 80 and 443.
    ports:
      web:
        port: 8000
        exposedPort: 80
      websecure:
        port: 8443
        exposedPort: 443
    service:
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      spec:
        type: LoadBalancer
        # Keeps the client's address, rather than the node's, on the requests Traefik sees - and only
        # sends traffic to the nodes a Traefik pod runs on.
        externalTrafficPolicy: Local
    deployment:
      replicas: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
    # Requests sized for a small cluster. No limit on CPU, so the proxy is never throttled; memory is
    # capped so a leak is a restart rather than pressure on the node.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
