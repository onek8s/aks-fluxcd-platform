# Traefik Proxy, serving the Kubernetes Gateway API - the `traefik` GatewayClass, created by the
# chart - and nothing else: no IngressClass, no Ingress provider, no IngressRoute (Kubernetes CRD)
# provider, no Gateway of the chart's own. The Gateway and its listeners are the platform's, in
# infrastructure/configs/gateway.
#
# It is reached through one load balancer: the Service is of type LoadBalancer, public with a public
# zone, and with the `azure-load-balancer-internal` annotation - a private address in the cluster's
# network - with a private one (dns_zone_private). Traefik copies its address into the Gateway's
# status, and external-dns publishes the listener hostnames in the zone.
#
# No CRDs are installed: the chart's own - Traefik's and Traefik Hub's, from its crds/ directory - are
# skipped, since nothing here uses them and the Kubernetes CRD provider is off. The Gateway API CRDs
# are not among them either: AKS manages those (aks-terraform), and nothing else may bring its own.
#
# The version follows patch releases on its own; a new minor version is a change to this file. The
# chart picks the Traefik Proxy image version it was released with.
#
# Traefik's minor version is tied to the Gateway API CRDs AKS installs, which follow the cluster's
# Kubernetes version (Gateway API v1.4.1 on 1.35, v1.5.1 on 1.36). At startup Traefik waits for a
# watch on every Gateway API kind it serves, and it does not serve a Gateway - no status, no address,
# so no DNS records either - until all of them sync. Traefik v3.6 (chart 39.0.x) watches the kinds of
# Gateway API v1.4 - BackendTLSPolicy v1 among them - and so needs Kubernetes 1.35 or later; v3.7
# (chart 40 and later) also watches TLSRoute v1, which only v1.5 has, and needs 1.36. Move to v3.7
# once every cluster is on 1.36.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  # The release lives in flux-system, where the AKS Flux extension's `flux-applier` service account
  # holds the rights to install it, and is installed into `traefik` - see the README.
  releaseName: traefik
  targetNamespace: traefik
  storageNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: "39.0.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 12h
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    providers:
      kubernetesCRD:
        enabled: false
      kubernetesGateway:
        enabled: true
        # A route in any namespace may name Traefik's internal services - the dashboard's
        # `api@internal`, see infrastructure/configs/gateway/dashboard.yaml. Restricting that to
        # ingress-gateway (`crossProviderNamespaces`) takes Traefik v3.7.1; until then a team could
        # serve the read-only dashboard on its own listener, which shows nothing the platform's
        # dashboard listeners do not already show to the same network.
      kubernetesIngress:
        enabled: false
    # The dashboard, on by default, said here because a route depends on it. It is served on the
    # Gateway (dashboard.yaml), never on an entry point of its own: the API stays secure.
    api:
      dashboard: true
    gatewayClass:
      enabled: true
      name: traefik
    gateway:
      enabled: false
    ingressClass:
      enabled: false
    # The Gateway's listeners name `web-pub` (9000) and `websecure-pub` (9443), the entry points inside
    # the pod, which the load balancer serves on 80 and 443. `web` and `websecure`, the chart's
    # defaults, are on no Service: nothing listens on them from outside.
    ports:
      web:
        port: 8000
        exposedPort: 80
        expose:
          default: false
      websecure:
        port: 8443
        exposedPort: 443
        expose:
          default: false
      web-pub:
        port: 9000
        exposedPort: 80
        protocol: TCP
        expose:
          default: true
      websecure-pub:
        port: 9443
        exposedPort: 443
        protocol: TCP
        expose:
          default: true
        http:
          tls:
            enabled: true
    # The type is the chart's `service.type`, not one in `service.spec`: chart 39 writes both into the
    # Service, and a duplicate key fails Flux's post-render.
    #
    # The one load balancer in front of Traefik: a public IP when the zone is public, an Azure internal
    # load balancer - a private IP in the cluster's network - when it is private (dns_zone_private,
    # from aks-terraform). external-dns-public publishes ${public_hostname} as an A record to its
    # address, and every listener's hostname is a CNAME to that. The annotation is under
    # external-dns.kubernetes.io/: external-dns 0.23 no longer reads the old
    # external-dns.alpha.kubernetes.io/ prefix.
    service:
      type: LoadBalancer
      annotations:
        # ${quote}...${quote}: "true" / "false" has to stay a string after substitution.
        service.beta.kubernetes.io/azure-load-balancer-internal: ${quote}${dns_zone_private}${quote}
        external-dns.kubernetes.io/hostname: ${public_hostname}
      spec:
        # Keeps the client's address, rather than the node's, on the requests Traefik sees - and only
        # sends traffic to the nodes a Traefik pod runs on.
        externalTrafficPolicy: Local
    # One replica: the prototype cluster is a single small node, where a second proxy buys no
    # availability and takes room the rest of the platform needs. An update stops the old pod before
    # it starts the new one (the chart's default surges a third pod first), so it never needs room
    # for an extra pod - at the price of a few seconds without a proxy. Raise replicas, and put the
    # surge back, on a cluster with nodes to spare.
    deployment:
      replicas: 1
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
    # Requests sized for a small cluster. No limit on CPU, so the proxy is never throttled; memory is
    # capped so a leak is a restart rather than pressure on the node.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
