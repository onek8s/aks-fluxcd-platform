# The namespaces a zone's gateway watches - its own and its tenants' - as the ConfigMap `tenants-<zone>`
# in flux-system, applied by the zone's Flux configuration `tenants-<zone>` (Kustomization
# `tenants-<zone>-namespaces`), which aks-terraform's tenants/ stack keeps from its catalogue:
#
#   ${zone}                      the isolation zone
#   ${gateway_watch_namespaces}  a YAML flow sequence, `[<zone>-gateway,<zone>-<app>,...]`
#   ${quote}                     a double quote
#
# The cell's Traefik configuration of the zone (aks-terraform gateways/traefik) reads it with
# `substituteFrom`, so a new tenant changes nothing of the cell (design section 3.3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
