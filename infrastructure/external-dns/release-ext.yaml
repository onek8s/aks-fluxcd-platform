# external-dns for the external gateways - the external zones' and the platform's, the Gateways
# labelled `platform/exposure: ext`: for every hostname of an HTTPRoute attached to one, an A record
# in the public zone ${dns_zone_name} to the gateway's address (its load balancer's, which the implementation
# copies into the Gateway's status), and a TXT record beside it marking it as this cluster's.
#
# A route that names a hostname every cell serves - one Azure Traffic Manager answers for
# (aks-terraform, shared/: global_hostnames) - says so with the annotation
# `external-dns.kubernetes.io/controller: traffic-manager`, and is left alone.
#
# It acts as the `<cluster identity>-dns` identity aks-terraform creates, federated with this
# release's service account (`external-dns` in `external-dns` - the name is part of the federation,
# so it cannot change), which holds DNS Zone Contributor on the public zone and Private DNS Zone
# Contributor on the internal ones. On the system pool.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-ext
  namespace: flux-system
spec:
  interval: 1h
  releaseName: external-dns-ext
  targetNamespace: external-dns
  storageNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      version: "1.23.x"
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: external-dns-ext
    provider:
      name: azure
    sources:
      - gateway-httproute
    extraArgs:
      - --gateway-label-filter=platform/exposure=ext
    domainFilters:
      - "${dns_zone_name}"
    # Records it created and that are no longer wanted are deleted; records it did not create - no
    # TXT record with this owner beside them - are never touched.
    policy: sync
    txtOwnerId: "${cluster_name}"
    serviceAccount:
      name: external-dns
      annotations:
        azure.workload.identity/client-id: "${dns_identity_client_id}"
    podLabels:
      azure.workload.identity/use: "true"
    extraVolumes:
      - name: azure-config
        configMap:
          name: external-dns-azure-ext
    extraVolumeMounts:
      - name: azure-config
        mountPath: /etc/kubernetes
        readOnly: true
    nodeSelector:
      kubernetes.azure.com/mode: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
