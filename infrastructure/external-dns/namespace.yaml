# Held to the restricted Pod Security Standard, like every namespace the cluster manages itself. The
# chart runs external-dns non-root, with no privilege escalation, every capability dropped and the
# RuntimeDefault seccomp profile, so it meets it as it is.
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
