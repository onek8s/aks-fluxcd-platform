# external-dns's Cilium policy (design section 2.4; CIS AKS Benchmark 4.4.2): out to the API server,
# for the routes it publishes, and to Entra ID and Azure Resource Manager, for the DNS zones it writes
# as its workload identity. In: only the node (kubelet probes).
# Layers 3 and 4 only (design D80: no ACNS, so no FQDN or DNS rules): out on 443 to `world` - outside
# the cluster - where the hub firewall decides by name (platform allow-lists in azure-landing-zone).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-dns
  namespace: external-dns
spec:
  description: "external-dns: out to the API server, Entra ID and Azure Resource Manager"
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
