# The internal zones' managed external-dns, in an internal cluster only (OneK8s design decision D52):
# its own Flux Kustomization, `external-dns-internal`, after `external-dns`, which creates the
# namespace and the service account it shares.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-dns-int.yaml
