# The internal zones' resource group (the cells') for external-dns-int - see ../azure-config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-azure-int
  namespace: external-dns
data:
  azure.json: |
    {
      "tenantId": "${azure_tenant_id}",
      "subscriptionId": "${dns_zone_subscription_id}",
      "resourceGroup": "${internal_dns_resource_group_name}",
      "useWorkloadIdentityExtension": true
    }
