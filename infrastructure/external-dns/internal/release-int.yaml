# external-dns for the internal gateways - `platform/exposure: int` - into the internal zones' Azure
# Private DNS zones (int-fi.<env>.onek8s.lol, ...), which aks-terraform's shared/ creates in the
# cells' resource group and links to every cell's network. Only in an internal cluster: internal and
# external workloads never share a cluster (OneK8s design decision D52), so an external one has no
# internal gateway and no private zone, and does not pull this directory in. The same identity and service account as above,
# created by that release; a TXT owner of its own.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-int
  namespace: flux-system
spec:
  interval: 1h
  releaseName: external-dns-int
  targetNamespace: external-dns
  storageNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      version: "1.23.x"
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 12h
  # Retried until it succeeds (-1): behind the hub firewall a first install can time out while a source is
  # still blocked, and three spent retries would leave the release stalled after the rule opens.
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  dependsOn:
    - name: external-dns-ext
  values:
    fullnameOverride: external-dns-int
    provider:
      name: azure-private-dns
    sources:
      - gateway-httproute
    extraArgs:
      - --gateway-label-filter=platform/exposure=int
      # Only the routes this cell is to publish (design section 10): an internal app runs in one home cell, and
      # only that cell publishes its name <app>.<zone domain>. Each route names the publishing cell in
      # platform/home-cell - its own cluster for a cell's own names (hello-<cluster>...), the app's home cell
      # (`home_cell`, aks-terraform) for the app's name.
      - --annotation-filter=platform/home-cell=${cluster_name}
    domainFilters:
      - "${dns_zone_name}"
    policy: sync
    txtOwnerId: "${cluster_name}-int"
    serviceAccount:
      create: false
      name: external-dns
    podLabels:
      azure.workload.identity/use: "true"
    extraVolumes:
      - name: azure-config
        configMap:
          name: external-dns-azure-int
    extraVolumeMounts:
      - name: azure-config
        mountPath: /etc/kubernetes
        readOnly: true
    nodeSelector:
      kubernetes.azure.com/mode: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
