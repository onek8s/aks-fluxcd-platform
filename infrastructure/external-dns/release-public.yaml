# external-dns a third time, for the one public address the cluster has: Traefik's `traefik-public`
# Service (infrastructure/traefik), whose ${flux_webhook_hostname} annotation it publishes as an A
# record to the Service's public IP in the public zone. It reads Services in `traefik` and nowhere
# else: a team that annotates a Service of its own publishes nothing.
#
# It is not release.yaml with a second source, because a source there would read every namespace's
# Services, and the internal Gateway's routes it reads live in the team namespaces. It acts as the
# same `external-dns` service account as release.yaml - the one aks-terraform federates for the
# public zone - and owns its records under a TXT owner of its own, so neither release ever deletes
# what the other keeps.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-public
  namespace: flux-system
spec:
  interval: 1h
  releaseName: external-dns-public
  targetNamespace: external-dns
  storageNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      version: "1.23.x"
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Installed after release.yaml, whose chart creates the service account this one runs as.
  dependsOn:
    - name: external-dns
  values:
    fullnameOverride: external-dns-public
    provider:
      name: azure
    sources:
      - service
    extraArgs:
      - --namespace=traefik
    domainFilters:
      - "${dns_zone_name}"
    excludeDomains:
      - "${internal_dns_zone_name}"
    policy: sync
    txtOwnerId: "${cluster_name}-public"
    serviceAccount:
      create: false
      name: external-dns
    podLabels:
      azure.workload.identity/use: "true"
    extraVolumes:
      - name: azure-config
        configMap:
          name: external-dns-azure
    extraVolumeMounts:
      - name: azure-config
        mountPath: /etc/kubernetes
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
