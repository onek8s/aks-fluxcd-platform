# The Azure provider's configuration file, which external-dns insists on reading even though it
# authenticates through workload identity and holds no credential. Nothing in it is secret, so it is
# a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-azure
  namespace: external-dns
data:
  azure.json: |
    {
      "tenantId": "${azure_tenant_id}",
      "subscriptionId": "${dns_zone_subscription_id}",
      "resourceGroup": "${dns_zone_resource_group_name}",
      "useWorkloadIdentityExtension": true
    }
