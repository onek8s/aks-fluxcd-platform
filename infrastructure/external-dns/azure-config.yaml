# The Azure provider's configuration files, which external-dns insists on reading even though it
# authenticates through workload identity and holds no credential. Nothing in them is secret, so
# they are ConfigMaps: the public zone's resource group for the external gateways (and the
# platform's); internal/ adds the internal zones' for an internal cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-azure-ext
  namespace: external-dns
data:
  azure.json: |
    {
      "tenantId": "${azure_tenant_id}",
      "subscriptionId": "${dns_zone_subscription_id}",
      "resourceGroup": "${dns_zone_resource_group_name}",
      "useWorkloadIdentityExtension": true
    }
