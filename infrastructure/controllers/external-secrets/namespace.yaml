# Held to the restricted Pod Security Standard, like every namespace the cluster manages itself.
# The chart's controller, webhook and cert controller all run non-root, with no privilege escalation,
# every capability dropped and the RuntimeDefault seccomp profile, so they meet it as they are.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    platform/team: platform
    platform/cost-center: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    platform/contact: https://github.com/onek8s/aks-fluxcd-platform/issues
---
# The default service account hands no token to a pod that names none (CIS AKS Benchmark 4.1.5);
# every pod here runs as an account of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: external-secrets
automountServiceAccountToken: false
