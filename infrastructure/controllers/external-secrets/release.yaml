# External Secrets Operator, the platform's: the CRDs, the validating webhook and the controller that
# keeps the webhook's certificate - installed once per cluster - and the controller of the
# platform's own namespaces (`controller: platform` - flux-system, platform-gateway), on the system
# pool. Every isolation zone runs a controller of its own on its own nodes, for its own namespaces
# (infrastructure/zones, design section 6); none of them installs CRDs or a webhook.
#
# The version follows patch releases on its own; a new minor version is a change to this file.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  # The release lives in flux-system, where the AKS Flux extension's `flux-applier` service account
  # holds the rights to install it, and is installed into `external-secrets` - see the README.
  releaseName: external-secrets
  targetNamespace: external-secrets
  storageNamespace: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: "2.12.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
      interval: 12h
  # Retried until it succeeds (-1): behind the hub firewall a first install can time out while a source is
  # still blocked, and three spent retries would leave the release stalled after the rule opens.
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart ships its CRDs as ordinary templates rather than in crds/, so they are installed and
    # upgraded with the release - Flux's `crds` policy does not apply to them. They are kept when the
    # release is removed: deleting a CRD deletes every ExternalSecret and store of that kind with it.
    installCRDs: true
    crds:
      annotations:
        helm.sh/resource-policy: keep
    # Only the stores that name `controller: platform`; a zone's are its zone controller's.
    controllerClass: platform
    # The system pool, which only the platform's controllers tolerate (aks-terraform:
    # default_node_pool.node_taints).
    nodeSelector:
      kubernetes.azure.com/mode: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    # Requests sized for a small cluster. No limits on CPU, so the controllers are never throttled;
    # memory is capped so a leak is a restart rather than pressure on the node.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhook:
      nodeSelector:
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    certController:
      nodeSelector:
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
