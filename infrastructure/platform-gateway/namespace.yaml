# Baseline enforced, restricted audited and warned on: App Routing's gateway pods set no seccomp
# profile - see infrastructure/zones/namespaces.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-gateway
  labels:
    platform/team: platform
    platform/cost-center: platform
    platform/role: platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    platform/contact: https://github.com/onek8s/aks-fluxcd-platform/issues
---
# The default service account hands no token to a pod that names none (CIS AKS Benchmark 4.1.5);
# every pod here runs as an account of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: platform-gateway
automountServiceAccountToken: false
