# Baseline enforced, restricted audited and warned on: App Routing's gateway pods set no seccomp
# profile - see infrastructure/zones/namespaces.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-gateway
  labels:
    platform/role: platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
