# The platform gateway's Cilium policy (design section 5; CIS AKS Benchmark 4.4.2), like a zone's
# gateway (infrastructure/zones/cilium.yaml): in on its one listener, 443, from the load balancer -
# whose clients keep their own addresses, so they are `world` to Cilium - and from the node (kubelet
# probes); out to Flux's webhook receivers (notification-controller's port 9292 in flux-system, the only
# routes it may carry) and to App Routing's istiod for its configuration and certificates (xDS, 15012).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gateway
  namespace: platform-gateway
spec:
  description: "The platform gateway: HTTPS in from the load balancer, out to Flux's webhook receivers"
  endpointSelector: {}
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
      toPorts:
        - ports:
            - port: "9292"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: aks-istio-system
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.cluster.local"
              - matchPattern: "*.*.cluster.local"
              - matchPattern: "*.*.*.cluster.local"
              - matchPattern: "*.*.*.*.cluster.local"
