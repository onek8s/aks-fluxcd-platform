# Traefik's dashboard, on the `https-traefik` listener of the platform Gateway - on the internet
# - with no authentication: anyone who reaches it can read it. This is
# a prototype's choice; the dashboard is read-only and changes nothing in Traefik, but it shows every
# router, service and backend the cluster has. Put it behind authentication, or take it off the
# public Gateway, before anything here matters.
#
# The dashboard and the API it reads are Traefik's internal service `api@internal` (the chart's
# `api.dashboard`, on by default), which the Gateway API provider lets a route name as a
# TraefikService. Nothing of that kind exists in the cluster - the CRD is not even installed - and
# Traefik resolves the name itself. The bare hostname is sent on to the dashboard's own path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashboard
  namespace: platform-gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      sectionName: https-traefik
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /dashboard/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /dashboard
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: api@internal
