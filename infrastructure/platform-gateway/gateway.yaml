# The platform's Gateway: HTTPS only, one listener per hostname the cluster's platform serves, each
# open to routes from the namespace that serves it. external-dns publishes the hostnames in the public
# zone (`platform/exposure: ext`).
#
#   ${flux_webhook_hostname}  Flux's webhook receivers (infrastructure/flux-webhook)
#   ${traefik_hostname}       this Traefik's dashboard (dashboard.yaml)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: platform-gateway
  labels:
    platform/gateway: platform
    platform/exposure: ext
spec:
  gatewayClassName: traefik-platform
  listeners:
    - name: https-flux-webhook
      protocol: HTTPS
      port: 8443
      hostname: ${flux_webhook_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
    - name: https-traefik
      protocol: HTTPS
      port: 8443
      hostname: ${traefik_hostname}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Same
