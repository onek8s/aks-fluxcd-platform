# Traefik (`gateway_implementation = "traefik"`): only an annotation on the Gateway; Traefik itself is
# aks-terraform's (gateways/traefik).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# A component cannot be empty: it marks the Gateway with the implementation that serves it.
patches:
  - target:
      group: gateway.networking.k8s.io
      kind: Gateway
    patch: |-
      - op: add
        path: /metadata/annotations/platform~1gateway-implementation
        value: traefik
