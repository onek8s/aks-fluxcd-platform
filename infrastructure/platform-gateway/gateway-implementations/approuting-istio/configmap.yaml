# App Routing: the system pool, small requests, a public load balancer on 443 only and
# `externalTrafficPolicy: Local` - see infrastructure/zones/gateway.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway
  namespace: platform-gateway
data:
  deployment: |
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
          containers:
            - name: istio-proxy
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 512Mi
  service: |
    metadata:
      labels:
        platform/exposure: ext
      annotations:
        service.beta.kubernetes.io/port_80_health-probe_port:
        service.beta.kubernetes.io/port_80_health-probe_protocol:
        service.beta.kubernetes.io/port_80_health-probe_request-path:
        service.beta.kubernetes.io/port_443_health-probe_port:
        service.beta.kubernetes.io/port_443_health-probe_protocol:
        service.beta.kubernetes.io/port_443_health-probe_request-path:
    spec:
      externalTrafficPolicy: Local
