# Traefik Proxy for the platform's Gateway (gateway.yaml), on the system pool behind a public load
# balancer - see infrastructure/zones/traefik.yaml, which this follows but for the dashboard, the
# node pool and the load balancer, which is always public.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-platform
  namespace: flux-system
spec:
  interval: 1h
  releaseName: traefik-platform
  targetNamespace: platform-gateway
  storageNamespace: platform-gateway
  chart:
    spec:
      chart: traefik
      version: "41.7.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 12h
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    fullnameOverride: traefik
    providers:
      kubernetesCRD:
        enabled: false
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
        labelSelector: platform/gateway=platform
        # Only this namespace's routes may name Traefik's internal services - the dashboard's
        # `api@internal` (dashboard.yaml).
        crossProviderNamespaces:
          - platform-gateway
        gateways:
          - name: platform
            namespace: platform-gateway
    # The dashboard, served on the Gateway (dashboard.yaml), never on an entry point of its own.
    api:
      dashboard: true
    gatewayClass:
      enabled: true
      name: traefik-platform
      labels:
        platform/gateway: platform
    gateway:
      enabled: false
    ingressClass:
      enabled: false
    ports:
      web:
        expose:
          default: false
      websecure:
        port: 8443
        exposedPort: 443
        expose:
          default: true
        http:
          tls:
            enabled: true
    service:
      annotations:
        # The probe the load balancer sends, over TCP to the port: no plain HTTP path to probe.
        service.beta.kubernetes.io/port_443_health-probe_protocol: tcp
      labels:
        platform/exposure: ext
      spec:
        type: LoadBalancer
        # Keeps the client's address on the requests Traefik sees, and sends traffic only to the
        # nodes a Traefik pod runs on.
        externalTrafficPolicy: Local
    # The system pool: the platform's own.
    nodeSelector:
      kubernetes.azure.com/mode: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    # One replica in the lab: a second buys no availability on one node. Replaced rather than
    # surged on an update.
    deployment:
      replicas: 1
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
