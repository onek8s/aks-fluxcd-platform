# Flux's webhook receiver on the internet: `/hook/` of ${flux_webhook_hostname}, on the
# `https-flux-webhook` listener of the platform Gateway (infrastructure/platform-gateway), to
# notification-controller's webhook receiver. Nothing else of the receiver is routed. The Flux
# extension's `allow-webhooks` NetworkPolicy already lets the gateway's pods reach it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: platform-gateway
      name: platform
      sectionName: https-flux-webhook
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
