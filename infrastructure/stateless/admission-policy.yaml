# No persistent storage on a stateless cluster. aks-terraform turns off every CSI driver AKS offers
# and the snapshot controller there (persistent_storage_enabled = false), but AKS's addon-manager
# still creates two StorageClasses of its own, `default` and `managed-csi-premium-v2`, and - being
# `addonmanager.kubernetes.io/mode: EnsureExists` - creates them again whenever they are deleted.
# Enforced by the API server itself - a ValidatingAdmissionPolicy, no webhook to run - on creation:
#
#   - No StorageClass and no PersistentVolume is created, by anyone - the addon-manager included. So
#     once this policy is in place, AKS's two classes are deleted once by a cluster admin and stay
#     deleted:
#
#       kubectl delete storageclass default managed-csi-premium-v2
#
#   - No PersistentVolumeClaim is created, in any namespace. A generic ephemeral volume is a claim
#     the cluster creates for the pod, and is refused on the pod already, with a clearer message.
#   - A pod mounts no inline `csi` or `ephemeral` volume. `emptyDir`, `configMap`, `secret`,
#     `projected` and `downwardAPI` - the volumes that live and die with the pod - stay allowed.
#
# Only creation is checked. kube-system is left out for pods and claims: it is AKS's. StorageClasses
# and PersistentVolumes are cluster-wide, so the binding's namespaceSelector does not apply to them.
#
# To give the cluster storage after all, turn the CSI drivers back on in aks-terraform and swap
# this directory for infrastructure/storage; AKS creates its classes again on its next reconcile.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: no-persistent-storage
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["storage.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["storageclasses"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["persistentvolumes", "persistentvolumeclaims", "pods"]
  validations:
    - expression: >-
        !(request.resource.resource in ['storageclasses', 'persistentvolumes', 'persistentvolumeclaims'])
      messageExpression: >-
        'This cluster is stateless: it has no persistent storage, so ' + request.resource.resource + ' cannot be
        created (' + object.metadata.name + ').'
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'pods' || !has(object.spec.volumes) ||
        object.spec.volumes.all(volume, !has(volume.csi) && !has(volume.ephemeral))
      message: >-
        This cluster is stateless: pods cannot mount csi or ephemeral volumes. Use emptyDir for scratch
        space.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: no-persistent-storage
spec:
  policyName: no-persistent-storage
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
