# External Secrets Operator for the zone (design section 6): one controller per isolation zone, on
# the system pool, with controllerClass ${zone} - it reconciles only the SecretStores that name
# `controller: ${zone}`, the ones of the zone's namespaces, and its path to Key Vault is the zone's
# own. The CRDs, the conversion webhook and its certificate are installed once per cluster, by the
# platform's release (infrastructure/controllers/external-secrets); none of that here.
#
# Still open (design, open questions): the chart's RBAC lets the controller read and write Secrets
# in every namespace, not only the zone's.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets-${zone}
  namespace: flux-system
spec:
  interval: 1h
  releaseName: external-secrets-${zone}
  targetNamespace: ${zone}-secrets
  storageNamespace: ${zone}-secrets
  chart:
    spec:
      chart: external-secrets
      version: "2.12.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: external-secrets-${zone}
    installCRDs: false
    controllerClass: ${zone}
    # Namespaced SecretStores and ExternalSecrets only: the cluster-scoped kinds and PushSecret are
    # the platform's (design section 6).
    processClusterExternalSecret: false
    processClusterPushSecret: false
    processClusterStore: false
    processClusterGenerator: false
    processPushSecret: false
    webhook:
      create: false
    certController:
      create: false
    podLabels:
      platform/zone: ${zone}
    # The system pool, next to the platform's own gateway and controllers: a zone without
    # applications then has no nodes at all - its NodePools scale to zero (infrastructure/node-pools).
    nodeSelector:
      kubernetes.azure.com/mode: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
