# The zone's one Gateway (design section 4.1): HTTPS only, for every name of the zone's domain
# (*.${zone_domain}), with the zone's wildcard certificate (certificate.yaml). Only the zone's own
# application namespaces - `platform/zone: ${zone}`, not a platform namespace - may attach routes,
# so a route can never reach into another zone's gateway. A route names its hostnames, below the
# zone's domain; external-dns publishes them at the gateway's address - in the public zone for an
# external zone, the zone's private one for an internal zone (infrastructure/external-dns picks the
# Gateways by `platform/exposure`).
#
# The class is App Routing's Gateway API implementation, `approuting-istio`: a sidecar-less Istio
# control plane - no service mesh. For this Gateway it creates, in this namespace,
# `${zone}-approuting-istio`: an Envoy Deployment, its `LoadBalancer` Service, an autoscaler and a
# disruption budget, shaped by the ConfigMap `gateway` (gateway-parameters.yaml) that the Gateway
# names in `infrastructure.parametersRef`. It copies the load balancer's address into the Gateway's
# status, listens on 443 and labels its pods `gateway.networking.k8s.io/gateway-name: ${zone}`, which
# cilium.yaml lets in. App Routing's listeners offer HTTP/2 and HTTP/1.1, TLS 1.2 and 1.3 (design
# section 4.1). Flux `force` re-creates the Gateway rather than failing on a change of class.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${zone}
  namespace: ${zone}-gateway
  labels:
    platform/zone: ${zone}
    platform/exposure: ${zone_exposure}
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  gatewayClassName: approuting-istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${zone_domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform/zone: ${zone}
            matchExpressions:
              - key: platform/role
                operator: DoesNotExist
