# One isolation zone of a stateless cell - OneK8s design sections 2.3 to 2.6, 4.1 and 5.1 - applied once
# per zone by a Flux Kustomization of its own (clusters/<cluster>/zones.yaml), which fills in the
# zone's values:
#
#   ${zone}            int-fi, ext-se, ...
#   ${zone_exposure}   int or ext
#   ${zone_internal}   "true" for an internal zone: its gateway is behind an internal load balancer
#   ${zone_domain}     int-fi.dev.onek8s.lol - the zone's names, and its wildcard certificate's
#   ${gateway_client_id}  the identity `<zone>-gateway` reads its certificate in the platform vault as
#   ${zone_platform_node_label}, ${zone_platform_node_value}
#                      optional: the nodes the zone's gateway and ESO run on, by default the zone's
#                      own (platform/zone, the zone); kubernetes.azure.com/mode, system for the
#                      system pool
#
# and the cluster's own from cluster-settings.yaml (key_vault_url, azure_tenant_id, quote).
#
# The zone's two platform namespaces run on the zone's own nodes, so that the gateway reaches the
# applications inside the zone's slots, without the hub firewall; a non-production cell may put them
# on the system pool, so that a zone without applications has no nodes (its node pools scale to zero):
#
#   <zone>-gateway   The zone's Gateway `<zone>` - class approuting-istio (App Routing's Envoy pods
#                    and load balancer), one
#                    HTTPS listener for *.<zone domain>, which only the zone's application namespaces
#                    may attach routes to - and its certificate.
#   <zone>-secrets   External Secrets Operator for the zone: controllerClass <zone>, so it syncs the
#                    zone's stores only.
#
# and the Cilium policies of the zone: the baseline of every application namespace of the zone
# (default deny, DNS, ingress from the zone's gateway only), and the platform-owned policies of the
# two namespaces above.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - external-secrets.yaml
  - gateway.yaml
  - gateway-parameters.yaml
  - certificate.yaml
  - cilium.yaml
