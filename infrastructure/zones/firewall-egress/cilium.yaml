# Egress of a zone's applications (design section 5.2): the hub's firewall decides, not Cilium. The pods have
# addresses of the zone's pod subnet, which they keep up to the firewall, so its rules tell the zones apart (their IP groups), its log tells
# the pods apart, and onek8s/aks-ai-agents' egress agent proposes each application's rules
# (azure-landing-zone, firewall-applications/) from the flows it denied.
#
# Added to the zone's baseline (../cilium.yaml), whose default deny keeps every other destination INSIDE the
# cluster closed: an application namespace reaches the outside world - every address that is not an endpoint,
# node or the API server of this cluster - on any port, and resolves any name through CoreDNS (layers 3 and 4
# only: no ACNS, design D80), so the flow reaches the firewall. Platform-owned and cluster-wide (the landing zone's
# app-egress policy refuses a team's own `toEntities`).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ${zone}-firewall-egress
spec:
  description: "The ${zone} zone's application namespaces: out to the world through the hub firewall, which decides"
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.platform/zone
        operator: In
        values: ["${zone}"]
      - key: k8s:io.cilium.k8s.namespace.labels.platform/role
        operator: DoesNotExist
  # Never the node's own Azure endpoints, which `world` would include: the instance metadata service hands out the
  # node's identities' tokens to whoever asks (design R5), and the wire server is the VM agent's. Deny wins over the
  # allow below; the zone's pods resolve names through CoreDNS, never 168.63.129.16 themselves.
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
        - 168.63.129.16/32
  egress:
    - toEntities:
        - world
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
