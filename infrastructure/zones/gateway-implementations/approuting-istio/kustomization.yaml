# App Routing's Gateway API implementation (`gateway_implementation = "approuting-istio"`): the ConfigMap
# that shapes the zone gateway's Envoy Deployment and Service, named by the Gateway's
# `infrastructure.parametersRef`. Traefik refuses that reference, so it is here rather than in the
# zone's Gateway itself.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - configmap.yaml
patches:
  - target:
      group: gateway.networking.k8s.io
      kind: Gateway
    patch: |-
      - op: add
        path: /metadata/annotations/platform~1gateway-implementation
        value: approuting-istio
      - op: add
        path: /spec/infrastructure
        value:
          parametersRef:
            group: ""
            kind: ConfigMap
            name: gateway
