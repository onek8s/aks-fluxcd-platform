# infra-observability's Cilium policy (design section 2.4; CIS AKS Benchmark 4.4.2), a platform
# namespace with a platform-owned egress policy (design section 6.2), for its pods on the pod network:
# kube-state-metrics, the Beyla Kubernetes cache, OpenCost and the Alloy operator. Out to the API
# server, the kubelets (10250), the Grafana Cloud stack and Azure's retail prices (OpenCost) - nothing
# else; between its own pods. In: its own pods, and the nodes - the collectors, Alloy and
# node-exporter, run on the host network (Grafana's Fleet Management presets, decision D48), where
# Cilium sees them as host / remote-node and no pod policy applies to them.
#
# Layers 3 and 4 only (design D80: no ACNS, so no FQDN or DNS rules): out on 443 to `world` - outside
# the cluster - where the hub firewall decides by name: Grafana Cloud's ingest hosts (under grafana.net,
# observability_fqdns in azure-landing-zone), prices.azure.com, and the API server by its FQDN. In acc
# and prd the stack is reached through Private Link instead (section 6.2).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: observability
  namespace: infra-observability
spec:
  description: "Alloy and OpenCost: out to the API server, the kubelets, Grafana Cloud and Azure retail prices"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
  egress:
    - toEndpoints:
        - {}
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Also the API server by its FQDN, as AKS hands it to the pods annotated
    # kubernetes.azure.com/set-kube-service-host-fqdn (kube-state-metrics): its private endpoint.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
