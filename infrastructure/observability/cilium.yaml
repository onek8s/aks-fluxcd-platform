# infra-observability's Cilium policy (design section 5; CIS AKS Benchmark 4.4.2), a platform
# namespace with a platform-owned egress policy (design section 19): out to the API server (discovery,
# events, logs metadata), the kubelets of every node (port 10250: kubelet and cAdvisor metrics), the
# Grafana Cloud stack and Azure's retail prices (OpenCost) - nothing else; between its own pods
# (Alloy scraping kube-state-metrics and OpenCost, Alloy clustering, the operator). In: only its own
# pods and the node (kubelet probes).
#
# Grafana Cloud's ingest hosts are named per region and cluster number (prometheus-prod-<n>-...,
# logs-prod-<n>...), all under grafana.net; the lab allows that domain. In acc and prd the stack is
# reached through Private Link instead (section 19), and this names its hosts.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: observability
  namespace: infra-observability
spec:
  description: "Alloy and OpenCost: out to the API server, the kubelets, Grafana Cloud and Azure retail prices"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - {}
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.grafana.net"
              - matchName: prices.azure.com
              - matchPattern: "*.cluster.local"
              - matchPattern: "*.*.cluster.local"
              - matchPattern: "*.*.*.cluster.local"
              - matchPattern: "*.*.*.*.cluster.local"
              - matchPattern: "*.*.*.*.*.cluster.local"
              - matchPattern: "*.*.*.*.*.*.cluster.local"
              - matchPattern: "*.*.*.*.*.*.*.cluster.local"
              - matchPattern: "*.*.*.internal.cloudapp.net"
              - matchPattern: "*.*.*.*.internal.cloudapp.net"
              - matchPattern: "*.*.*.*.*.internal.cloudapp.net"
              - matchPattern: "*.*.*.*.*.*.internal.cloudapp.net"
              - matchPattern: "*.*.*.*.*.*.*.internal.cloudapp.net"
              - matchPattern: "*.*.*.*.*.*.*.*.internal.cloudapp.net"
              - matchPattern: "*.*.*.*.*.*.*.*.*.internal.cloudapp.net"
    - toFQDNs:
        - matchPattern: "*.grafana.net"
        - matchName: prices.azure.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
