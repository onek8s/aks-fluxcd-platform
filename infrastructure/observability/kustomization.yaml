# Observability and cost (OneK8s design section 19): Grafana's k8s-monitoring chart in the platform
# namespace infra-observability - Grafana Alloy collecting metrics, logs and Kubernetes events and
# sending them to the environment's Grafana Cloud stack, kube-state-metrics, and OpenCost, which
# turns each namespace's requests and usage into cost from Azure's retail prices.
#
# The stack's endpoints, user IDs and access token come from the platform vault, as flux-system's
# share of it: the secret `flux-system--grafana-cloud` (see key-vault.yaml). Until that secret
# exists, the HelmRelease waits for it and nothing is installed; nothing else waits for this.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - key-vault.yaml
  - release.yaml
  - cilium.yaml
