# Observability and cost (OneK8s design section 6.2): Grafana's k8s-monitoring chart in the platform
# namespace infra-observability, as Grafana Cloud's Fleet Management sets it up - Grafana Alloy on
# every node, taking its pipelines from the environment's stack (remote configuration), node-exporter,
# kube-state-metrics, Beyla's Kubernetes cache - and OpenCost, which turns each namespace's requests
# and usage into cost from Azure's retail prices.
#
# The stack's Fleet Management URL, user and token come from the platform vault: the secret
# `flux-system--grafana-cloud` (see key-vault.yaml). Until that secret exists, the HelmRelease waits
# for it and nothing is installed; nothing else waits for this.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - key-vault.yaml
  - release.yaml
  - cilium.yaml
