# Privileged enforced, restricted audited and warned on: the collectors - Alloy and node-exporter,
# DaemonSets - run as Grafana's Fleet Management presets set them, privileged, on the host network and
# PID namespace with the node's logs, cgroups and storage mounted (decision D48), which only the
# privileged standard admits. kube-state-metrics, the Beyla cache, OpenCost and the operator meet
# restricted. The owner labels are the
# platform's, like every namespace the platform creates (Azure Policy: namespace-ownership).
apiVersion: v1
kind: Namespace
metadata:
  name: infra-observability
  labels:
    platform/role: platform
    platform/team: platform
    platform/cost-center: platform
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    platform/contact: https://github.com/onek8s/aks-fluxcd-platform/issues
---
# The default service account hands no token to a pod that names none (CIS AKS Benchmark 4.1.5);
# every pod here runs as an account of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: infra-observability
automountServiceAccountToken: false
