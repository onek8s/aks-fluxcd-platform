# Grafana's k8s-monitoring chart (design section 19) as Grafana Cloud sets it up for Fleet Management:
# the collectors take their pipelines - what to collect and where to send it - from the stack's Fleet
# Management (remote configuration), so collection is managed in Grafana Cloud and this release only
# runs the collectors and the services they read (decision D48). Installed into infra-observability:
#
#   alloy-daemon        Alloy, a DaemonSet on every node - zone, spot and system nodes: Grafana's
#                       presets (privileged, host network and PID, the node's cgroups and storage) so it
#                       can read the node's logs and metrics and instrument applications with eBPF
#                       (Beyla), node-locally, as its Fleet Management pipelines say
#   node-exporter       every node's host metrics (host network and PID)
#   kube-state-metrics  on the system pool, with the namespaces' owner labels
#   beyla k8s cache     Kubernetes metadata for the eBPF instrumentation, on the system pool
#   OpenCost            off until the vault secret enables it (below), on the system pool
#
# The Fleet Management URL, user and token, and OpenCost's settings, come from the Secret
# grafana-cloud (key-vault.yaml); the chart keeps the credentials in infra-observability.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: flux-system
spec:
  interval: 1h
  releaseName: k8s-monitoring
  targetNamespace: infra-observability
  storageNamespace: infra-observability
  chart:
    spec:
      chart: k8s-monitoring
      version: "4.5.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # The Fleet Management URL, user and token, and OpenCost's settings once the vault has them, as one
  # YAML document (key-vault.yaml). OpenCost reads the cluster's usage back from the stack's Prometheus,
  # which the Fleet Management token cannot: it runs once the vault secret also has a token with
  # metrics:read (prometheus-query-url, prometheus-username, prometheus-read-token).
  valuesFrom:
    - kind: Secret
      name: grafana-cloud
      valuesKey: values.yaml
  values:
    cluster:
      name: ${cluster_name}

    collectorCommon:
      alloy:
        remoteConfig:
          enabled: true

    collectors:
      alloy-daemon:
        presets: [large, root, host-storage, host-network, host-cgroup, clustered, service-discovery, filesystem-log-reader, daemonset]
        # The large preset's limits, but much smaller requests: the 1 GiB it requests per node does not
        # fit the lab cell's one 8 GiB system node beside the rest (the user's choice over another
        # system node). Under memory pressure it is the first to be evicted.
        alloy:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
        controller:
          # The node's own collector, like Cilium's agent: on a full node the scheduler makes room for it
          # by moving a lower-priority Deployment pod to another node (the system nodes' requests run at
          # 90 % and more, mostly AKS's own pods).
          priorityClassName: system-node-critical
          # AKS: the API server by its FQDN rather than the kubernetes Service, which a host-network
          # pod cannot rely on (the chart refuses to render on AKS without it).
          podAnnotations:
            kubernetes.azure.com/set-kube-service-host-fqdn: "true"
          # Every node: the system pool's taint, the zones', spot and GPU taints, and the startup
          # taints of a node that is still coming up.
          tolerations:
            - operator: Exists

    alloy-operator:
      nodeSelector:
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      waitForAlloyRemoval:
        nodeSelector:
          kubernetes.azure.com/mode: system
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists

    telemetryServices:
      node-exporter:
        deploy: true
        tolerations:
          - operator: Exists
      kube-state-metrics:
        deploy: true
        podAnnotations:
          kubernetes.azure.com/set-kube-service-host-fqdn: "true"
        # Who owns each namespace (Azure Policy: namespace-ownership) and its zone, as
        # kube_namespace_labels and kube_namespace_annotations, so that cost and usage can be grouped
        # by team and cost centre.
        metricLabelsAllowlist:
          - namespaces=[platform/team,platform/cost-center,platform/zone]
        metricAnnotationsAllowList:
          - namespaces=[platform/contact]
        nodeSelector:
          kubernetes.azure.com/mode: system
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      beyla:
        deploy: true
        k8sCache:
          replicas: 1
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
      opencost:
        deploy: false
        metricsSource: custom
        opencost:
          exporter:
            defaultClusterId: ${cluster_name}
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
          ui:
            enabled: false
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
